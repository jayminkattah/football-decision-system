[project]
name = "football-decision-system"
version = "0.1.0"
description = "Market-calibrated probabilistic decision system using football betting markets as a test environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "pandera>=0.20.0",
    "pyarrow>=15.0.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"